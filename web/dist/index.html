<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-ACE 2.0 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=3" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="mark">B-ACE</span>
        <span class="ver">2.0</span>
      </div>
      <nav>
        <button data-view="live" class="active">Live</button>
        <button data-view="replay">Replay</button>
        <button data-view="experiment">Experiment</button>
      </nav>
      <div id="health" class="health">…</div>
    </header>

    <main>
      <section id="view-live" class="view">
        <aside class="panel">
          <h2>Parallel jobs</h2>
          <label>Envs <input id="num-envs" type="number" min="1" max="32" value="4" /></label>
          <label>Agents / side <input id="num-agents" type="number" min="1" max="4" value="1" /></label>
          <label>Max cycles <input id="max-cycles" type="number" min="10" value="200" /></label>
          <button id="start-job" class="cta">Start simulation</button>
          <ul id="job-list"></ul>

          <h2>View</h2>
          <div class="seg" id="layout-seg">
            <button type="button" data-layout="split" class="active">Split</button>
            <button type="button" data-layout="focus">Focus</button>
          </div>
          <label>Env
            <select id="env-picker"></select>
          </label>
          <div class="cam-modes" data-scene="live">
            <button type="button" data-cam="orbit" class="active">Orbit</button>
            <button type="button" data-cam="chase">Chase</button>
            <button type="button" data-cam="tactical">Tactical</button>
          </div>
          <label class="check"><input id="cfg-radar" type="checkbox" checked /> Radar</label>
          <label class="check"><input id="cfg-tracks" type="checkbox" checked /> Tracks</label>
          <label class="check"><input id="cfg-wez" type="checkbox" checked /> WEZ</label>
          <label class="check"><input id="cfg-labels" type="checkbox" checked /> Labels</label>
          <label class="check"><input id="cfg-stems" type="checkbox" checked /> Altitude stems</label>
          <label>Aircraft <input id="cfg-ac-scale" type="range" min="1" max="8" step="0.5" value="3" /></label>
          <label>Missiles <input id="cfg-msl-scale" type="range" min="1" max="10" step="0.5" value="4" /></label>
          <label>Altitude <input id="cfg-alt-scale" type="range" min="1" max="10" step="0.5" value="4" /></label>
        </aside>
        <div class="stage">
          <div class="viewport" id="live-viewport">
            <canvas id="live-canvas"></canvas>
            <div class="view-toolbar">
              <button type="button" id="back-split" class="ghost hidden">Back to split</button>
            </div>
          </div>
          <div id="live-meta" class="meta"></div>
        </div>
      </section>

      <section id="view-replay" class="view hidden">
        <aside class="panel">
          <h2>Past runs</h2>
          <button id="refresh-runs">Refresh</button>
          <ul id="run-list"></ul>
          <div class="scrub">
            <input id="scrubber" type="range" min="0" max="0" value="0" />
            <div class="row">
              <button id="play-replay">Play</button>
              <label>Speed <input id="replay-speed" type="number" min="0.25" max="20" step="0.25" value="2" /></label>
            </div>
          </div>
        </aside>
        <div class="stage">
          <div class="viewport" id="replay-viewport">
            <canvas id="replay-canvas"></canvas>
            <div class="view-toolbar">
              <div class="cam-modes" data-scene="replay">
                <button type="button" data-cam="orbit" class="active">Orbit</button>
                <button type="button" data-cam="chase">Chase</button>
                <button type="button" data-cam="tactical">Tactical</button>
              </div>
            </div>
          </div>
          <pre id="replay-inspect" class="inspect"></pre>
        </div>
      </section>

      <section id="view-experiment" class="view hidden">
        <aside class="panel">
          <h2>Batch experiment</h2>
          <label>Recipe
            <select id="exp-recipe">
              <option value="wez">WEZ validation</option>
              <option value="fsm">FSM search</option>
            </select>
          </label>
          <label id="exp-cases-label">Repeats / pop <input id="exp-cases" type="number" min="1" max="32" value="4" /></label>
          <label>Max cycles <input id="exp-cycles" type="number" min="20" value="150" /></label>
          <label id="exp-gen-row" class="hidden">Generations <input id="exp-gens" type="number" min="1" max="30" value="5" /></label>
          <button id="run-exp" class="cta">Run experiment</button>
          <p id="exp-summary" class="meta"></p>
        </aside>
        <div class="stage exp-stage">
          <div class="table-wrap">
            <table id="exp-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
          <pre id="exp-out" class="inspect"></pre>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js?v=3"></script>
</body>
</html>
